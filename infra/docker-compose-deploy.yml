# Deploy compose for a Windows server that stores Docker data on C:.
# Runtime secrets and deploy-specific values are loaded from env-deploy.

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  INTERNAL_RPC_TOKEN: ${INTERNAL_RPC_TOKEN:?INTERNAL_RPC_TOKEN is required}

x-app-service: &app-service
  restart: unless-stopped
  networks:
    - platform-net

services:
  postgres:
    image: postgres:16-alpine
    container_name: ropp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD is required}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD is required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - C:/docker-data/ropp/postgres:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - platform-net

  redis:
    image: redis:7-alpine
    container_name: ropp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - C:/docker-data/ropp/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - platform-net

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: ropp-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - C:/docker-data/ropp/kafka:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 18
      start_period: 60s
    networks:
      - platform-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ropp-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - platform-net

  kafka-init:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: ropp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    restart: "no"
    networks:
      - platform-net

  auth-service:
    <<: *app-service
    image: nqhquochung/ropp-auth-service:latest
    container_name: ropp-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *common-env
      AUTH_DB_HOST: postgres
      AUTH_DB_PORT: 5432
      AUTH_DB_USERNAME: auth_service
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_SECURE: ${CLOUDINARY_SECURE:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_PARTNER_REQUEST_CREATED: partner.request.created.v1
      TOPIC_PARTNER_REQUEST_DECIDED: partner.request.decided.v1

  inventory-service:
    <<: *app-service
    image: nqhquochung/ropp-inventory-service:latest
    container_name: ropp-inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: *common-env
      INVENTORY_DB_HOST: postgres
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_USERNAME: inventory_service
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD is required}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_SECURE: ${CLOUDINARY_SECURE:-true}
      PRODUCT_IMAGE_MAX_SIZE_BYTES: ${PRODUCT_IMAGE_MAX_SIZE_BYTES:-5242880}
      PRODUCT_IMAGE_MAX_REQUEST_SIZE_BYTES: ${PRODUCT_IMAGE_MAX_REQUEST_SIZE_BYTES:-6291456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_PRODUCT_REVIEW_CREATED: product.review.created.v1
      TOPIC_PRODUCT_REVIEW_UPDATED: product.review.updated.v1
      TOPIC_PRODUCT_REVIEW_COMMENT_CREATED: product.review.comment.created.v1

  payment-service:
    <<: *app-service
    image: nqhquochung/ropp-payment-service:latest
    container_name: ropp-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      <<: *common-env
      PAYMENT_DB_HOST: postgres
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_USERNAME: payment_service
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD is required}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:?VNPAY_RETURN_URL is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  notification-service:
    <<: *app-service
    image: nqhquochung/ropp-notification-service:latest
    container_name: ropp-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8085"
    expose:
      - "9095"
    environment:
      <<: *common-env
      NOTIFICATION_DB_HOST: postgres
      NOTIFICATION_DB_PORT: 5432
      NOTIFICATION_DB_USERNAME: notification_service
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_PAYMENT_SUCCEEDED: payment.transaction.succeeded.v1
      TOPIC_PAYMENT_FAILED: payment.transaction.failed.v1
      TOPIC_ORDER_PAID: order.lifecycle.paid.v1
      TOPIC_ORDER_COMPLETED: order.lifecycle.completed.v1
      TOPIC_ORDER_FAILED: order.lifecycle.failed.v1
      TOPIC_PARTNER_REQUEST_CREATED: partner.request.created.v1
      TOPIC_PARTNER_REQUEST_DECIDED: partner.request.decided.v1
      TOPIC_PRODUCT_REVIEW_CREATED: product.review.created.v1
      TOPIC_PRODUCT_REVIEW_UPDATED: product.review.updated.v1
      TOPIC_PRODUCT_REVIEW_COMMENT_CREATED: product.review.comment.created.v1
      ORDER_SERVICE_INTERNAL_URL: http://order-service:8082
      INVENTORY_SERVICE_INTERNAL_URL: http://inventory-service:8083
      NOTIFICATION_GRPC_PORT: 9095

  order-service:
    <<: *app-service
    image: nqhquochung/ropp-order-service:latest
    container_name: ropp-order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *common-env
      ORDER_DB_HOST: postgres
      ORDER_DB_PORT: 5432
      ORDER_DB_USERNAME: order_service
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_SERVICE_INTERNAL_URL: http://inventory-service:8083
      PAYMENT_SERVICE_INTERNAL_URL: http://payment-service:8084

  api-gateway:
    <<: *app-service
    image: nqhquochung/ropp-api-gateway:latest
    container_name: ropp-api-gateway
    depends_on:
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      <<: *common-env
      AUTH_SERVICE_URI: http://auth-service:8081
      ORDER_SERVICE_URI: http://order-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8084
      NOTIFICATION_SERVICE_URI: http://notification-service:8085
      NOTIFICATION_GRPC_HOST: notification-service
      NOTIFICATION_GRPC_PORT: 9095
      GATEWAY_SELF_URI: ${GATEWAY_SELF_URI:?GATEWAY_SELF_URI is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:?APP_CORS_ALLOWED_ORIGIN_PATTERNS is required}

  frontend:
    <<: *app-service
    image: nqhquochung/ropp-frontend:latest
    container_name: ropp-frontend
    depends_on:
      api-gateway:
        condition: service_started
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    ports:
      - "0.0.0.0:80:80"

networks:
  platform-net:
    driver: bridge
