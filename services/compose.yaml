name: realtime-order-platform

x-common-service-environment: &common-service-environment
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_RPC_TOKEN: ${INTERNAL_RPC_TOKEN:?Set INTERNAL_RPC_TOKEN in .env}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-local-auth-password}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-local-order-password}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-local-inventory-password}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-local-payment-password}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-local-notification-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./local/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-redis-password}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
    restart: unless-stopped
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  auth-service:
    build:
      context: ./auth-service
    environment:
      <<: *common-service-environment
      AUTH_DB_HOST: postgres
      AUTH_DB_USERNAME: auth_service
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-local-auth-password}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  inventory-service:
    build:
      context: ./inventory-service
    environment:
      <<: *common-service-environment
      INVENTORY_DB_HOST: postgres
      INVENTORY_DB_USERNAME: inventory_service
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-local-inventory-password}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  payment-service:
    build:
      context: ./payment-service
    environment:
      <<: *common-service-environment
      PAYMENT_DB_HOST: postgres
      PAYMENT_DB_USERNAME: payment_service
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-local-payment-password}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  order-service:
    build:
      context: ./order-service
    environment:
      <<: *common-service-environment
      ORDER_DB_HOST: postgres
      ORDER_DB_USERNAME: order_service
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-local-order-password}
      INVENTORY_SERVICE_INTERNAL_URL: http://inventory-service:8083
      PAYMENT_SERVICE_INTERNAL_URL: http://payment-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  notification-service:
    build:
      context: ./notification-service
    environment:
      <<: *common-service-environment
      NOTIFICATION_DB_HOST: postgres
      NOTIFICATION_DB_USERNAME: notification_service
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-local-notification-password}
      ORDER_SERVICE_INTERNAL_URL: http://order-service:8082
      INVENTORY_SERVICE_INTERNAL_URL: http://inventory-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      <<: *common-service-environment
      AUTH_SERVICE_URI: http://auth-service:8081
      ORDER_SERVICE_URI: http://order-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8084
      NOTIFICATION_SERVICE_URI: http://notification-service:8085
      NOTIFICATION_GRPC_HOST: notification-service
      GATEWAY_SELF_URI: http://api-gateway:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
